<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks | Pietercil</title>
<link rel="icon" href="_shared/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
  :root { --brand: #eca900; --fg: #222; --dim: #545454; --line: #d9d9d9; --bg: #fff; --bg-2: #f3f3f3; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f3f3f3; --dim: #c4c4c4; --line: #404040; --bg: #1b1b1b; --bg-2: #222; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; }
  header { background: #222; color: #fff; padding: 28px 16px; }
  header .in, main { max-width: 960px; margin: 0 auto; }
  header .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header svg { height: 32px; display: block; }
  .switch { display: flex; gap: 6px; }
  .switch button { font: inherit; font-size: 14px; font-weight: 800; letter-spacing: .04em; padding: 5px 12px; border: 1px solid #555; border-radius: 999px; background: transparent; color: #c4c4c4; cursor: pointer; transition: background .2s, border-color .2s; }
  .switch button:hover { border-color: var(--brand); color: #fff; }
  .switch button.on { background: var(--brand); border-color: var(--brand); color: #222; }
  main { padding: 48px 16px 80px; }
  h1 { font-size: clamp(36px, 6vw, 56px); font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; }
  h1::before { content: ""; display: block; width: 80px; height: 8px; background: var(--brand); margin-bottom: 24px; }
  p.lead { color: var(--dim); font-size: 19px; margin: 0 0 40px; }
  .deck + .deck { margin-top: 24px; }
  .deck { position: relative; border: 1px solid var(--line); border-top: 6px solid var(--brand); padding: 22px 24px; background: var(--bg); transition: border-color .2s; }
  .deck:hover { border-color: var(--brand); }
  .deck h2 { margin: 0 0 6px; font-size: 24px; }
  .deck h2 a { color: inherit; text-decoration: none; }
  /* The title link covers the whole card, so a click anywhere on it opens the deck. */
  .deck h2 a::after { content: ""; position: absolute; inset: 0; }
  .deck:hover h2 a, .deck h2 a:focus-visible { text-decoration: underline; text-decoration-color: var(--brand); text-underline-offset: 4px; }
  .deck p { margin: 0; color: var(--dim); }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; padding: 0; list-style: none; }
  .tags li { padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg-2); font-size: 14px; font-weight: 600; color: var(--dim); }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
</style>
</head>
<body>
<header>
  <div class="in">
    <div id="logo"></div>
    <div class="switch" role="group" aria-label="Taal / Language">
      <button type="button" data-lang="nl" lang="nl">NL</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </div>
</header>
<main>
  <h1>Decks</h1>
  <p class="lead" data-t="lead"></p>
  <div class="deck">
    <h2><a data-deck="mattpocock-skills/" data-t="skills.title"></a></h2>
    <p data-t="skills.desc"></p>
    <ul class="tags" data-tags="skills"></ul>
  </div>
  <div class="deck">
    <h2><a data-deck="agent-plugins/" data-t="plugins.title"></a></h2>
    <p data-t="plugins.desc"></p>
    <ul class="tags" data-tags="plugins"></ul>
  </div>
</main>
<script>window.DECK = {}; window.I18N = { nl: {} };</script>
<script src="_shared/helpers.js"></script>
<script>
document.getElementById('logo').innerHTML = DECK.h.logo(32).replace('var(--brand)', '#eca900');

const TEXT = {
  nl: {
    lead: 'Presentaties en handleidingen.',
    'skills.title': 'Skills for Real Engineers',
    'skills.desc': 'De agent skills van Matt Pocock, van idee tot onderhoud: een overzicht van tien minuten en een naslag met elke skill.',
    'skills.tags': ['Agent skills', 'Van idee tot onderhoud', '10 min', 'Naslag per skill'],
    'plugins.title': 'Een gereedschapskist voor je agent',
    'plugins.desc': 'Wat een agent plugin en een marketplace zijn, en hoe ze elke organisatie kunnen helpen: een plugin als gereedschapskist voor één domein, een marketplace als het rek met kisten. Een eerste kennismaking van tien minuten en een naslag.',
    'plugins.tags': ['Plugins', 'Marketplace', 'Voor elke organisatie', '10 min', 'Naslag'],
  },
  en: {
    lead: 'Presentations and guides.',
    'skills.title': 'Skills for Real Engineers',
    'skills.desc': 'Matt Pocock’s agent skills, from idea to maintenance: a ten-minute overview and a reference with every skill.',
    'skills.tags': ['Agent skills', 'From idea to maintenance', '10 min', 'Reference per skill'],
    'plugins.title': 'A toolkit for your agent',
    'plugins.desc': 'What an agent plugin and a marketplace are, and how they can help any organisation: a plugin as a toolkit for one domain, a marketplace as the rack of toolkits. A ten-minute first introduction and a reference.',
    'plugins.tags': ['Plugins', 'Marketplace', 'For any organisation', '10 min', 'Reference'],
  },
};

// Same order as the decks: ?lang=, then the site-wide choice (deck.lang, shared with every deck), then the browser, then NL.
const LANGS = Object.keys(TEXT);
const qs = new URLSearchParams(location.search);
const saved = (() => { try { return localStorage.getItem('deck.lang'); } catch (e) { return null; } })();
const fromBrowser = (navigator.languages || [navigator.language || 'nl']).map((l) => String(l).toLowerCase().split('-')[0]).find((l) => LANGS.includes(l));
const lang = [qs.get('lang'), saved, fromBrowser].find((l) => LANGS.includes(l)) || LANGS[0];

function setLang(l, remember = true) {
  if (remember) { try { localStorage.setItem('deck.lang', l); } catch (e) { /* storage unavailable */ } }
  const t = TEXT[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('[data-tags]').forEach((ul) => { ul.innerHTML = t[ul.dataset.tags + '.tags'].map((x) => `<li>${x}</li>`).join(''); });
  document.querySelectorAll('[data-deck]').forEach((a) => { a.href = a.dataset.deck + '?lang=' + l; a.hreflang = l; });
  document.querySelectorAll('[data-lang]').forEach((b) => { b.classList.toggle('on', b.dataset.lang === l); b.setAttribute('aria-pressed', b.dataset.lang === l); });
  if (qs.has('lang')) { qs.set('lang', l); history.replaceState(null, '', location.pathname + '?' + qs); }
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
// A ?lang= link is a choice too; a guess from the browser is not stored.
setLang(lang, lang === qs.get('lang') || lang === saved);
</script>
</body>
</html>
